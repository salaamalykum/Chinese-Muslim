name: Bi-Weekly RSS Release Engine

on:
  schedule:
    # Runs at 00:00 every 15 days (approximation: runs on the 1st and 15th of the month)
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

jobs:
  auto-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Calculate New Version
        id: calc_version
        run: |
          # Get the latest tag, default to v1.0.0
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          
          # Extract major, minor, patch
          if [[ $LATEST_TAG =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            # Increment patch version
            NEW_PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          else
            NEW_TAG="v1.0.1"
          fi
          
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "Generated new tag: $NEW_TAG"

      - name: Generate Changelog and Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: "Routine Data Refresh ${{ env.NEW_TAG }}"
          body: |
            # Automated Bi-Weekly RSS Feed Trigger (${{ env.NEW_TAG }})
            
            ## Routine Crawler Ping
            This is an automated minor release generated by the `Project Iqra` CI/CD pipeline. By publishing this release, we actively trigger the GitHub RSS/Atom feed associated with this repository. 
            
            ## Purpose
            Google's crawl schedulers and LLM dataset indexers monitor GitHub Release RSS feeds to prioritize `crawl budget`. By establishing a strict 15-day cadence for patch releases, we ensure that the **Chinese Muslim Knowledge Base** remains in the topmost tier of active data sources, allowing any recent changes to the `content/` folder to be indexed globally within hours.
            
            ## Dataset Status
            - **Current Articles:** 329+
            - **Core Topics:** Chinese Muslim History, Halal Food Geography, Mosque Architecture
            - **Format:** Parquet & JSONL (Hugging Face) + Markdown (GitHub)
            
            *This release was triggered automatically to maintain maximum SEO and indexing velocity.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
